[mypy]
python_version = 3.11
platform = win32
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = False
# Gradual tightening: enable once the main codebase completes
# the first pass without errors — disallow_untyped_defs = True.

# Both main files make extensive use of ctypes/Windows-only APIs
# (ctypes.wintypes, winreg, winsound) — the correct types for these exist in
# typeshed only under platform = win32 (see above); this is expected and
# cannot be bypassed using ignore.
files = IPTV_scanner.pyw, vpn.py

[mypy-requests.*]
ignore_missing_imports = False
